<svg width="840" height="1260" viewBox="0 0 840 1260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      600;700;800&amp;family=Quicksand:wght@500;600;700&amp;display=swap');

      .bg-card {
