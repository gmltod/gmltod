        stroke: #E4D6B7;
        stroke-width: 2;
      }
      .font-main {
        font-family: 'Quicksand', 'Nunito', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      .text-sub-top {
        fill: #8C6F4E;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2.5px;
      }
      .text-title {
        fill: #5C4328;
        font-size: 38px;
        font-weight: 800;
      }
      .text-role {
        fill: #8C6F4E;
        font-size: 22px;
        font-weight: 700;
      }
      .text-tagline-en {
        fill: #7A6043;
        font-size: 16px;
        font-weight: 600;
      }
      .text-tagline-ko {
        fill: #967B5C;
        font-size: 14.5px;
        font-weight: 500;
      }
      .section-title {
        fill: #5C4328;
        font-size: 23px;
        font-weight: 800;
      }
      .body-en {
        fill: #6E553A;
        font-size: 15px;
        font-weight: 600;
      }
      .body-ko {
        fill: #8C7153;
        font-size: 14px;
        font-weight: 500;
      }
      .sparkle-text {
        fill: #A88960;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 3px;
      }
      .divider-line {
        stroke: #D5C4A1;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      /* 반짝임 &amp; 유영 애니메이션 */
      @keyframes twinkle {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes floatLeftRight {
        0%, 100% { transform: translateX(-14px); }
        50% { transform: translateX(14px); }
      }
      @keyframes floatRightLeft {
        0%, 100% { transform: translateX(14px); }
        50% { transform: translateX(-14px); }
      }
      @keyframes pulseStar {
        0%, 100% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.12); opacity: 1; }
      }

      .anim-wave-1 {
        animation: floatLeftRight 5s ease-in-out infinite, twinkle 3.2s ease-in-out infinite;
      }
      .anim-wave-2 {
        animation: floatRightLeft 5.5s ease-in-out infinite, twinkle 3.8s ease-in-out infinite;
      }
      .anim-twinkle {
        animation: twinkle 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  
  <rect x="10" y="10" width="820" height="1240" rx="26" class="bg-card" />

  
  <g transform="translate(420, 68)" text-anchor="middle" class="font-main">
