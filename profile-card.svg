  <g transform="translate(420, 355)" text-anchor="middle" class="font-main">
    <text y="0" class="section-title">🌿 About Me | 자기소개</text>

    <text y="42" class="body-en" font-weight="700">Hello! I'm whee, an Illustrator &amp; Animator.</text>
    <text y="68" class="body-en">I enjoy drawing and bringing my ideas to life through art and animation.</text>
    <text y="92" class="body-en">I'm particularly interested in fantasy illustrations, character design, and imaginative worlds.</text>
    <text y="116" class="body-en">This GitHub is my personal space where I share my creative projects and artistic journey.</text>

    <text y="156" class="body-ko" font-weight="700">안녕하세요! 저는 일러스트레이터이자 애니메이터인 whee입니다.</text>
    <text y="180" class="body-ko">그림을 그리고 애니메이션을 통해 저의 아이디어를 표현하는 것을 좋아합니다.</text>
    <text y="204" class="body-ko">특히 판타지 일러스트와 캐릭터 디자인, 상상 속 세계를 시각적으로 표현하는 작업에 관심이 있습니다.</text>
    <text y="228" class="body-ko">이 GitHub는 저의 관심 분야와 개인 프로젝트, 창작 활동을 기록하는 공간입니다.</text>

    
